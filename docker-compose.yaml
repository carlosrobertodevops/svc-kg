# =============================================================================
# Arquivo: docker-compose.yaml
# Versão: v1.8.0
# Objetivo: Orquestração (Coolify) — MIGRADO para Postgres direto.
#           svc-kg consome o Postgres do stack mondaha via DATABASE_URL
#           (vinda do .env / SSM) e o Redis local deste compose.
# Funções/métodos:
# - Serviço redis e svc-kg com healthcheck /live
# =============================================================================
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - obs_net

  svc-kg:
    build:
      context: .
      dockerfile: Dockerfile
    image: svc-kg:latest
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: 8080
      WORKERS: 2
      LOG_LEVEL: info

      CORS_ALLOW_ORIGINS: "*"
      CORS_ALLOW_CREDENTIALS: "false"
      CORS_ALLOW_HEADERS: "Authorization,Content-Type"
      CORS_ALLOW_METHODS: "GET,POST,OPTIONS"

      # MIGRADO: Postgres direto do stack mondaha (Supabase deprecado).
      # DATABASE_URL vem do .env / SSM. Ex. in-network do stack mondaha:
      #   postgresql://mondaha:mondaha@postgres:5432/mondaha
      DATABASE_URL: ${DATABASE_URL}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_POOL_TIMEOUT: ${PG_POOL_TIMEOUT:-10}
      KG_AUTO_MIGRATE: ${KG_AUTO_MIGRATE:-true}

      CACHE_STATIC_MAX_AGE: ${CACHE_STATIC_MAX_AGE:-86400}
      CACHE_API_TTL: ${CACHE_API_TTL:-60}

      # Redis local deste compose (serviço "redis" acima)
      ENABLE_REDIS_CACHE: "true"
      REDIS_URL: "redis://redis:6379/0"

      SERVER_CMD: gunicorn
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./assets:/app/assets
      - ./static:/app/static
      - ./docs:/app/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - obs_net

networks:
  obs_net:
    external: true
